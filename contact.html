<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Liên hệ</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body class="bg-gray-50 text-gray-800">
        <div id="site-header"></div>

        <main class="container mx-auto py-12 px-4 flex justify-center">
            <div class="bg-white p-8 rounded shadow-md w-full max-w-lg">
                <h2 class="text-2xl font-bold text-center mb-6">
                    Liên Hệ Với Chúng Tôi
                </h2>
                <form id="contact-form">
                    <div class="mb-4">
                        <label class="block mb-1">Họ và tên *</label>
                        <input
                            type="text"
                            id="name"
                            class="w-full border p-2 rounded outline-none focus:border-blue-500"
                        />
                        <small id="name-err" class="text-red-500 hidden"
                            >Vui lòng nhập họ tên.</small
                        >
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1">Email *</label>
                        <input
                            type="text"
                            id="email"
                            class="w-full border p-2 rounded outline-none focus:border-blue-500"
                        />
                        <small id="email-err" class="text-red-500 hidden"
                            >Email không hợp lệ.</small
                        >
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1">Số điện thoại *</label>
                        <input
                            type="text"
                            id="phone"
                            class="w-full border p-2 rounded outline-none focus:border-blue-500"
                        />
                        <small id="phone-err" class="text-red-500 hidden"
                            >Số điện thoại phải là số và không để trống.</small
                        >
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1">Nội dung *</label>
                        <textarea
                            id="message"
                            rows="4"
                            class="w-full border p-2 rounded outline-none focus:border-blue-500"
                        ></textarea>
                        <small id="message-err" class="text-red-500 hidden"
                            >Vui lòng nhập nội dung.</small
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-bold"
                    >
                        Gửi Liên Hệ
                    </button>
                </form>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="assets/js/layout.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
