<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng — GDU TechStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="site-header"></div>

    <!-- Page Header -->
    <div
      style="
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 20px 0;
      "
    >
      <div class="container mx-auto px-4">
        <nav class="breadcrumb">
          <a href="index.html">Trang chủ</a>
          <i class="fas fa-chevron-right"></i>
          <span style="color: var(--text-primary); font-weight: 600"
            >Giỏ hàng</span
          >
        </nav>
        <h1
          style="
            font-family: &quot;Be Vietnam Pro&quot;, sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
          "
        >
          Giỏ hàng của bạn
        </h1>
      </div>
    </div>

    <main class="container mx-auto py-8 px-4 flex-1">
      <div class="flex flex-col lg:flex-row gap-8">
        <!-- Cart Items Table -->
        <div class="w-full lg:w-2/3">
          <div class="cart-table bg-white">
            <table class="w-full">
              <thead>
                <tr>
                  <th class="p-4 text-left">Sản phẩm</th>
                  <th class="p-4">Đơn giá</th>
                  <th class="p-4">Số lượng</th>
                  <th class="p-4">Thành tiền</th>
                  <th class="p-4"></th>
                </tr>
              </thead>
              <tbody id="cart-items"></tbody>
            </table>
          </div>

          <!-- Continue shopping -->
          <div class="mt-4">
            <a href="products.html" class="btn-empty-cart">
              <i class="fas fa-arrow-left" style="font-size: 0.8rem"></i>
              Tiếp tục mua sắm
            </a>
          </div>
        </div>

        <!-- Summary -->
        <div class="w-full lg:w-1/3">
          <div class="cart-summary-card">
            <h3>
              <i
                class="fas fa-receipt"
                style="margin-right: 8px; color: var(--primary)"
              ></i
              >Tổng đơn hàng
            </h3>

            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                font-size: 0.9rem;
              "
            >
              <span style="color: var(--text-secondary)">Tạm tính</span>
              <span id="cart-total" class="cart-total-amount">0 ₫</span>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                font-size: 0.9rem;
              "
            >
              <span style="color: var(--text-secondary)">Phí vận chuyển</span>
              <span style="color: var(--success); font-weight: 600"
                >Miễn phí</span
              >
            </div>
            <div
              style="height: 1px; background: var(--border); margin: 16px 0"
            ></div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 4px;
              "
            >
              <span style="font-weight: 700; font-size: 0.95rem"
                >Tổng cộng</span
              >
              <span
                id="cart-total-final"
                class="cart-total-amount"
                style="font-size: 1.5rem"
                >0 ₫</span
              >
            </div>

            <button class="btn-checkout" onclick="handleCheckout()">
              <i class="fas fa-lock" style="font-size: 0.85rem"></i>
              Thanh toán ngay
            </button>

            <!-- Trust badges -->
            <div
              style="
                margin-top: 20px;
                padding-top: 16px;
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 5px;
                  font-size: 0.75rem;
                  color: var(--text-muted);
                "
              >
                <i
                  class="fas fa-shield-halved"
                  style="color: var(--success)"
                ></i>
                Thanh toán bảo mật
              </div>
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 5px;
                  font-size: 0.75rem;
                  color: var(--text-muted);
                "
              >
                <i class="fas fa-rotate-left" style="color: var(--primary)"></i>
                Đổi trả 30 ngày
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      // Mirror cart-total to cart-total-final
      const observer = new MutationObserver(() => {
        const src = document.getElementById("cart-total");
        const dest = document.getElementById("cart-total-final");
        if (src && dest) dest.textContent = src.textContent;
      });
      document.addEventListener("DOMContentLoaded", () => {
        const src = document.getElementById("cart-total");
        if (src)
          observer.observe(src, {
            childList: true,
            subtree: true,
            characterData: true,
          });
      });
    </script>
  </body>
</html>
