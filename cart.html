<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Giỏ hàng</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col">
        <div id="site-header"></div>

        <main class="container mx-auto py-8 px-4 flex-1">
            <h2 class="text-3xl font-bold mb-6">Giỏ hàng của bạn</h2>
            <div class="flex flex-col lg:flex-row gap-8">
                <div class="w-full lg:w-2/3">
                    <table class="w-full bg-white shadow-md rounded">
                        <thead class="bg-gray-200">
                            <tr>
                                <th class="p-3 text-left">Sản phẩm</th>
                                <th class="p-3">Đơn giá</th>
                                <th class="p-3">Số lượng</th>
                                <th class="p-3">Thành tiền</th>
                                <th class="p-3">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items"></tbody>
                    </table>
                </div>
                <div
                    class="w-full lg:w-1/3 bg-white p-6 shadow-md rounded h-fit"
                >
                    <h3 class="text-xl font-bold mb-4">Tổng Đơn Hàng</h3>
                    <div class="flex justify-between mb-4">
                        <span>Tổng tiền:</span>
                        <span
                            id="cart-total"
                            class="font-bold text-red-600 text-xl"
                            >0 VNĐ</span
                        >
                    </div>
                    <button
                        class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 font-bold"
                    >
                        Thanh Toán
                    </button>
                </div>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="assets/js/layout.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
