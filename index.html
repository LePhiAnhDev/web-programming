<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trang chủ - GDU TechStore</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body class="bg-gray-50 text-gray-800">
        <div id="site-header"></div>

        <main>
            <section class="bg-blue-600 text-white py-20 px-4 text-center">
                <div class="container mx-auto hero-animate">
                    <h1 class="text-4xl md:text-5xl font-bold mb-4">
                        Siêu Khuyến Mãi Mùa Hè!
                    </h1>
                    <p class="text-lg md:text-xl mb-8">
                        Giảm giá lên đến 50% cho Laptop và Điện thoại.
                    </p>
                    <a
                        href="products.html"
                        class="bg-white text-blue-600 px-6 py-3 rounded-full font-bold hover:bg-gray-100 transition"
                        >Mua Ngay</a
                    >
                </div>
            </section>

            <section class="container mx-auto py-12 px-4">
                <h2 class="text-3xl font-bold text-center mb-8">
                    Sản Phẩm Mới Nhất
                </h2>
                <div
                    id="latest-products"
                    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
                ></div>
            </section>
        </main>

        <div id="site-footer"></div>
        <script src="assets/js/layout.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
